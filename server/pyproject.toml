[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "findhub-history"
version = "0.1.0"
description = "Keeps a history of Google Find Hub device locations and shows it on a private map"
requires-python = ">=3.10"
license = "GPL-3.0-only AND MIT"
license-files = ["findhub/google/LICENSE", "findhub/google/NOTICE.md"]
authors = [{ name = "Shovon" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gpsoauth>=1.1.1",
    "requests>=2.32",
    "protobuf>=6.31.1,<7",
    "cryptography>=43",
    "pycryptodomex>=3.21",
    "ecdsa>=0.19",
    "aiohttp>=3.11",
    "http_ece>=1.1",
]

[project.urls]
Homepage = "https://github.com/ShovonCodes/findhub-history"
Issues = "https://github.com/ShovonCodes/findhub-history/issues"

[project.optional-dependencies]
login = [
    "selenium>=4.27",
    "undetected-chromedriver>=3.5.5",
    "httpx[http2]>=0.28",
    "setuptools>=75",
]
dev = [
    "pytest>=8",
    "httpx2>=2",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["findhub*"]

[tool.setuptools.package-data]
"findhub.google" = ["LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["findhub/google/fcm", "findhub/google/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
